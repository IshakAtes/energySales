name: autodeploy dealcheckers page

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      OWNER_LOWER: ${{ github.repository_owner | lower }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ env.OWNER_LOWER }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build -t ghcr.io/${{ env.OWNER_LOWER }}/energy-sales:latest .

      - name: Push image
        run: |
          docker push ghcr.io/${{ env.OWNER_LOWER }}/energy-sales:latest

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.ENERGY_WEBSITE_KEY }}
          script: |
            docker pull ghcr.io/${{ env.OWNER_LOWER }}/frontend:latest
            docker stop frontend || true
            docker rm frontend || true
            docker run -d \
              -p ${{ secrets.PORT }}:80 \
              --name energysales \
              ghcr.io/${{ env.OWNER_LOWER }}/frontend:latest