name: autodeploy dealcheckers page

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build image
        run: |
          docker build -t ghcr.io/ishak-ates/energysales:latest .

      - name: Push image
        run: |
          docker push ghcr.io/ishak-ates/energysales:latest

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.ENERGY_WEBSITE_KEY }}
          script: |
            echo "Pulling: ghcr.io/ishak-ates/energysales:latest"

            docker pull ghcr.io/ishak-ates/energysales:latest
            docker stop energysales || true
            docker rm energysales || true

            docker run -d \
              -p ${{ secrets.PORT }}:80 \
              --name energysales \
              ghcr.io/ishak-ates/energysales:latest
